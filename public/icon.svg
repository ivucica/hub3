<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Slip Card Shape -->
  <rect x="64" y="96" width="384" height="320" rx="18" fill="url(#card)" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.25))"/>
  
  <!-- Red HUB Slip Accent Bar -->
  <rect x="64" y="96" width="384" height="28" rx="18" fill="#ef4444"/>
  <rect x="64" y="112" width="384" height="12" fill="#ef4444"/>
  
  <!-- Talon divider perforation line -->
  <line x1="330" y1="124" x2="330" y2="416" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6,6"/>
  
  <!-- Barcode / QR Graphic Simulation -->
  <rect x="96" y="296" width="100" height="88" rx="8" fill="#1e293b"/>
  <!-- Barcode lines inside -->
  <rect x="110" y="310" width="8" height="60" fill="#ffffff"/>
  <rect x="124" y="310" width="4" height="60" fill="#ffffff"/>
  <rect x="134" y="310" width="12" height="60" fill="#ffffff"/>
  <rect x="152" y="310" width="6" height="60" fill="#ffffff"/>
  <rect x="164" y="310" width="18" height="60" fill="#ffffff"/>

  <!-- Slip Text Placeholders -->
  <rect x="96" y="150" width="120" height="10" rx="3" fill="#94a3b8"/>
  <rect x="96" y="170" width="190" height="12" rx="3" fill="#334155"/>
  <rect x="96" y="194" width="150" height="8" rx="2" fill="#94a3b8"/>
  
  <rect x="96" y="222" width="210" height="16" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="96" y="250" width="130" height="10" rx="3" fill="#64748b"/>
  <rect x="96" y="268" width="180" height="8" rx="2" fill="#94a3b8"/>

  <!-- Euro Symbol in Talon -->
  <circle cx="388" cy="180" r="32" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="388" y="192" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#dc2626" text-anchor="middle">€</text>
  
  <rect x="350" y="240" width="76" height="8" rx="2" fill="#94a3b8"/>
  <rect x="350" y="260" width="76" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="350" y="280" width="60" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="350" y="330" width="76" height="24" rx="4" fill="#fee2e2"/>
</svg>
